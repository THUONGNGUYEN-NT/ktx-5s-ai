name: Deploy Next.js Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ktx5s-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ktx5s-frontend
        run: npm ci

      - name: Build static site for GitHub Pages
        working-directory: ktx5s-frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://ktx-5s-ai-b3rk.onrender.com/api
        run: npm run build

      - name: Add .nojekyll for Next.js _next assets
        run: touch ktx5s-frontend/out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ktx5s-frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
